pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

// 中性项目名：避免开发目录名（含包名/版本代号）泄漏进成品 jar 的 MANIFEST
rootProject.name = "taczmeshloader"
